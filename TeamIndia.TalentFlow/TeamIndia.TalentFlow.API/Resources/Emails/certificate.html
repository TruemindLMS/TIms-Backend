<span style="display:none;max-height:0;overflow:hidden;">Your TalentFlow Certificate</span>

<table width="100%" cellpadding="0" cellspacing="0" role="presentation" style="background:#f4f6f8;padding:30px 0;">
  <tr>
    <td align="center">
      <table width="600" cellpadding="0" cellspacing="0" role="presentation" style="background:#ffffff;border-radius:8px;overflow:hidden;">
        <tr>
          <td style="padding:24px;text-align:center;background:#1A6B3C;color:#ffffff;font-weight:bold;font-size:20px;">
            TalentFlow
          </td>
        </tr>

        <tr>
          <td style="padding:28px;color:#555;line-height:1.5;">
            <h2 style="margin:0 0 12px;font-size:20px;color:#111;">Congratulations!</h2>
            <p style="margin:0 0 20px;color:#555;line-height:1.5;">You have successfully completed the course <strong>{CourseTitle}</strong>.</p>

            <p style="margin:0 0 20px;color:#555;line-height:1.5;">Below is your certificate for <strong>{CourseTitle}</strong> awarded to</p>
            <h3 style="margin:6px 0 18px;font-size:18px;color:#0b5ed7;">{UserName}</h3>

            <!-- certificate HTML inserted here -->
            {CertificateHtml}

            <p style="margin:18px 0 0;color:#777;font-size:13px;">
              Issued on {IssuedOn}
            </p>

            <p style="margin:18px 0 0;color:#777;font-size:13px;">
              If you have any issues, contact <a href="mailto:{SupportEmail}">{SupportEmail}</a>.
            </p>
          </td>
        </tr>

        <tr>
          <td style="padding:18px 28px;background:#fafafa;color:#777;font-size:13px;text-align:center;">
            © TalentFlow
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
